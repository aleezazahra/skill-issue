<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skill Issue — Relationship Graph</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --bg: #FBF4FA;
    --surface: #FFF9FC;
    --ink: #22314A;
    --secondary: #4C5C73;
    --muted: #7B879B;
    --line: #DCCFE2;
    --green: #6DBE63;
    --green-hover: #7DCC72;
    --green-deep: #3F7D39;
    --sky: #A9CDEA;
    --pink: #F4B8D8;
    --danger: #C25567;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap');

  body {
    font-family: 'Nunito Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
  }

  header .meta {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--secondary);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 12px;
    font-family: 'Space Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  #graph-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #graph-container svg {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
  }

  #graph-container svg:active {
    cursor: grabbing;
  }

  .node-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    pointer-events: none;
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    max-width: 260px;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 10;
  }

  .tooltip.visible {
    opacity: 1;
  }

  .tooltip h3 {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 2px;
  }

  .tooltip .kind {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .tooltip .sublabel {
    font-size: 11px;
    color: var(--secondary);
    margin-bottom: 4px;
  }

  .tooltip .meta-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    font-size: 10px;
  }

  .tooltip .meta-row dt {
    font-family: 'Space Mono', monospace;
    text-transform: uppercase;
    font-size: 9px;
    color: var(--muted);
  }

  .tooltip .meta-row dd {
    color: var(--ink);
    font-weight: 600;
    text-align: right;
  }

  .controls {
    position: absolute;
    bottom: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .controls button {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--secondary);
    font-size: 16px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .controls button:hover {
    background: var(--green);
    color: white;
    border-color: var(--green);
  }

  .hint {
    position: absolute;
    bottom: 16px;
    left: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
  }

  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    flex-direction: column;
    gap: 12px;
    color: var(--secondary);
  }

  .loading .spinner {
    width: 24px;
    height: 24px;
    border: 2px solid var(--line);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .error-state {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    flex-direction: column;
    gap: 8px;
    color: var(--danger);
  }

  .error-state p {
    font-size: 14px;
  }

  .error-state .sub {
    font-size: 12px;
    color: var(--secondary);
  }

  .no-data {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Relationship Graph</h1>
    <div class="meta" id="meta">Loading…</div>
  </div>
  <div class="legend" id="legend"></div>
</header>

<div id="graph-container">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span>Loading graph data…</span>
  </div>
  <div class="tooltip" id="tooltip"></div>
  <div class="controls">
    <button id="zoom-in" title="Zoom in">+</button>
    <button id="zoom-out" title="Zoom out">−</button>
    <button id="reset-view" title="Reset view">⟲</button>
  </div>
  <div class="hint">Drag to pan · Scroll to zoom</div>
</div>

<script>
const COLORS = {
  developer: { fill: '#22314A', stroke: '#6DBE63', dot: '#22314A', label: 'Developer' },
  repository: { fill: '#A9CDEA', stroke: '#5B8FD6', dot: '#A9CDEA', label: 'Repository' },
  skill:      { fill: '#6DBE63', stroke: '#3F7D39', dot: '#6DBE63', label: 'Skill' },
  issue:      { fill: '#F4B8D8', stroke: '#C25567', dot: '#F4B8D8', label: 'Issue' },
};

const EDGE_COLORS = {
  'contributes-to': '#7B879B',
  'evidence':       '#6DBE63',
  'matches':        '#C25567',
  'targets':        '#A9CDEA',
};

const EDGE_DASH = {
  'matches': '5 4',
};

const EDGE_LABELS = {
  'contributes-to': 'analyzed',
  'evidence':       'evidenced by',
  'matches':        'matches',
  'targets':        'belongs to',
};

function getAnalysisId() {
  const params = new URLSearchParams(window.location.search);
  return params.get('id') || (window.__ANALYSIS_ID__ || '');
}

async function fetchGraph(id) {
  const res = await fetch(`/api/analyses/${id}/graph`);
  if (!res.ok) {
    const body = await res.text();
    throw new Error(body || `HTTP ${res.status}`);
  }
  return res.json();
}

function truncate(value, max) {
  return value.length > max ? value.slice(0, max - 1) + '…' : value;
}

function renderGraph(graph) {
  const container = document.getElementById('graph-container');
  const loading = document.getElementById('loading');
  loading.style.display = 'none';

  const meta = document.getElementById('meta');
  meta.textContent = `${graph.stats.repositories} repositories · ${graph.stats.skills} skills · ${graph.stats.issues} issues · ${graph.stats.edges} relationships`;

  const legend = document.getElementById('legend');
  legend.innerHTML = Object.entries(COLORS).map(([kind, c]) =>
    `<span class="legend-item"><span class="legend-dot" style="background:${c.dot}"></span>${c.label} ${graph.stats[kind === 'developer' ? 'repositories' : kind + 's'] || 0}</span>`
  ).join('');

  const width = container.clientWidth;
  const height = container.clientHeight;

  const svg = d3.select('#graph-container')
    .append('svg')
    .attr('width', width)
    .attr('height', height);

  const g = svg.append('g');

  const tooltip = document.getElementById('tooltip');

  const simulation = d3.forceSimulation(graph.nodes)
    .force('link', d3.forceLink(graph.edges)
      .id(d => d.id)
      .distance(d => 60 + 40 * (1 - d.weight / 3))
      .strength(d => 0.3 + 0.4 * (d.weight / 3)))
    .force('charge', d3.forceManyBody()
      .strength(d => -(d.kind === 'developer' ? 300 : 80 + d.weight * 20)))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 8));

  const zoom = d3.zoom()
    .scaleExtent([0.3, 3])
    .on('zoom', (event) => {
      g.attr('transform', event.transform);
    });

  svg.call(zoom);

  document.getElementById('zoom-in').addEventListener('click', () => {
    zoom.scaleBy(svg.transition().duration(300), 1.3);
  });
  document.getElementById('zoom-out').addEventListener('click', () => {
    zoom.scaleBy(svg.transition().duration(300), 0.77);
  });
  document.getElementById('reset-view').addEventListener('click', () => {
    svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity);
  });

  const edgeGroup = g.append('g').attr('class', 'edges');
  const nodeGroup = g.append('g').attr('class', 'nodes');

  const edge = edgeGroup.selectAll('line')
    .data(graph.edges)
    .join('line')
    .attr('stroke', d => EDGE_COLORS[d.kind] || '#DCCFE2')
    .attr('stroke-width', 1)
    .attr('stroke-dasharray', d => EDGE_DASH[d.kind] || null)
    .attr('stroke-opacity', 0.5);

  const nodeRadius = (d) => {
    const base = { developer: 18, repository: 8, skill: 7, issue: 6 };
    const r = base[d.kind] || 6;
    return r + Math.min(d.weight || 1, 8) * 1.2;
  };

  const node = nodeGroup.selectAll('g')
    .data(graph.nodes)
    .join('g')
    .attr('cursor', 'pointer')
    .call(d3.drag()
      .on('start', (event, d) => {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      })
      .on('drag', (event, d) => {
        d.fx = event.x;
        d.fy = event.y;
      })
      .on('end', (event, d) => {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }));

  node.append('circle')
    .attr('r', nodeRadius)
    .attr('fill', d => COLORS[d.kind]?.fill || '#DCCFE2')
    .attr('stroke', d => COLORS[d.kind]?.stroke || '#B8A8C0')
    .attr('stroke-width', 1.5);

  node.filter(d => d.kind === 'developer')
    .append('circle')
    .attr('r', d => nodeRadius(d) + 7)
    .attr('fill', 'none')
    .attr('stroke', d => COLORS[d.kind]?.stroke || '#6DBE63')
    .attr('stroke-opacity', 0.35);

  node.append('text')
    .attr('class', 'node-label')
    .attr('y', d => nodeRadius(d) + 11)
    .attr('text-anchor', 'middle')
    .text(d => d.kind !== 'issue' || d === activeNode ? truncate(d.label, 20) : '')
    .attr('fill', d => COLORS[d.kind]?.stroke || '#3F7D39');

  let activeNode = null;

  node.on('mouseenter', (event, d) => {
    activeNode = d;
    highlight(d);
    showTooltip(event, d);
  })
  .on('mouseleave', () => {
    activeNode = null;
    clearHighlight();
    hideTooltip();
  })
  .on('click', (event, d) => {
    showTooltip(event, d, true);
  });

  svg.on('click', (event) => {
    if (event.target === svg.node()) {
      hideTooltip();
    }
  });

  function highlight(d) {
    const neighborIds = new Set();
    neighborIds.add(d.id);
    graph.edges.forEach(e => {
      if (e.source.id === d.id) neighborIds.add(e.target.id);
      if (e.target.id === d.id) neighborIds.add(e.source.id);
    });

    node.attr('opacity', n => neighborIds.has(n.id) ? 1 : 0.28);
    edge.attr('stroke-opacity', e =>
      (e.source.id === d.id || e.target.id === d.id) ? 0.95 : 0.12
    );
    edge.attr('stroke-width', e =>
      (e.source.id === d.id || e.target.id === d.id) ? 2 : 1
    );
  }

  function clearHighlight() {
    node.attr('opacity', 1);
    edge.attr('stroke-opacity', 0.5);
    edge.attr('stroke-width', 1);
  }

  function showTooltip(event, d, sticky) {
    const html = `
      <h3>${d.label}</h3>
      <div class="kind">${COLORS[d.kind]?.label || d.kind}${d.sublabel ? ' · ' + d.sublabel : ''}</div>
      ${d.meta ? '<div class="meta-row">' + Object.entries(d.meta).map(([k, v]) =>
        `<div><dt>${k}</dt><dd>${v}</dd></div>`
      ).join('') + '</div>' : ''}
    `;
    tooltip.innerHTML = html;
    tooltip.classList.add('visible');

    if (!sticky) {
      const move = (e) => {
        const rect = container.getBoundingClientRect();
        let tx = e.clientX - rect.left + 14;
        let ty = e.clientY - rect.top - 10;
        if (tx + 260 > rect.width) tx = e.clientX - rect.left - 270;
        if (ty < 4) ty = 4;
        tooltip.style.left = tx + 'px';
        tooltip.style.top = ty + 'px';
      };
      move(event);
      tooltip._move = move;
      container.addEventListener('mousemove', move);
    } else {
      const rect = container.getBoundingClientRect();
      const cx = event.clientX - rect.left;
      const cy = event.clientY - rect.top;
      let tx = cx + 14;
      let ty = cy - 10;
      if (tx + 260 > rect.width) tx = cx - 270;
      if (ty < 4) ty = 4;
      tooltip.style.left = tx + 'px';
      tooltip.style.top = ty + 'px';
      tooltip._sticky = true;
    }
  }

  function hideTooltip() {
    tooltip.classList.remove('visible');
    if (tooltip._move) {
      container.removeEventListener('mousemove', tooltip._move);
    }
    tooltip._sticky = false;
  }

  simulation.on('tick', () => {
    edge
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);

    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  window.addEventListener('resize', () => {
    const newWidth = container.clientWidth;
    const newHeight = container.clientHeight;
    svg.attr('width', newWidth).attr('height', newHeight);
    simulation.force('center', d3.forceCenter(newWidth / 2, newHeight / 2));
    simulation.alpha(0.3).restart();
  });
}

async function main() {
  let id = getAnalysisId();
  if (!id) {
    id = prompt('Enter analysis ID:');
    if (!id) {
      document.getElementById('loading').innerHTML = '<div class="no-data">No analysis ID provided. Add ?id=YOUR_ANALYSIS_ID to the URL.</div>';
      return;
    }
  }

  try {
    const graph = await fetchGraph(id);
    renderGraph(graph);
  } catch (err) {
    document.getElementById('loading').innerHTML = `
      <div class="error-state">
        <p>Failed to load graph</p>
        <div class="sub">${err.message}</div>
      </div>
    `;
  }
}

main();
</script>
</body>
</html>
